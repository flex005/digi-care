  <circle cx="80" cy="60" r="28" fill="#6935CF" />
  <path d="M20 160c0-33 27-60 60-60s60 27 60 60z" fill="#1E0059" />
  <circle cx="128" cy="32" r="10" fill="#A284F1" />
</svg>
