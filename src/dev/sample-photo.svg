<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Synthetic sample image">
  <!--
    A synthetic sample used ONLY on /dev/states, to exercise the `on_file`
    branch of PhotoStatus so it is not dead code. Deliberately abstract and
    unmistakably not a photograph of a person: no resident in the fixtures
    references it, and it never appears on a real screen.
  -->
